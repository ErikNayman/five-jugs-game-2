<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анатомия бизнеса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<!--
  АНАТОМИЯ БИЗНЕСА — шаблон интерактивного разбора бизнесов.
  Файл полностью автономный: без сборки и библиотек (шрифты Google подгружаются,
  если есть интернет; без него работают системные).

  КАК ДОБАВИТЬ СВОЙ БИЗНЕС
  1. Прокрутите файл вниз до блока <script id="businesses">.
  2. Скопируйте шаблон из блока <script type="text/plain" id="tpl-business">
     (или откройте в браузере вкладку «Добавить бизнес» и нажмите «Скопировать»).
  3. Вставьте его перед строкой «КОНЕЦ СПИСКА БИЗНЕСОВ» и заполните поля.
  4. Сохраните файл и обновите страницу. Движок сам построит все разделы.
  Любой раздел можно пропустить: если нет game, вкладки «Игра» не будет, и т.д.
-->
<style>
:root{
  color-scheme: light;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --sunk:#e3e8ee;
  --ink:#0f1823; --ink-2:#394556; --muted:#5f6b7c; --faint:#9aa4b2;
  --line:#d6dce4; --line-2:#bcc5d1;
  --pos:#12784a; --neg:#c0392b; --warn:#9a6200;
  --pos-bg:#e3f3ea; --neg-bg:#fbe7e4; --warn-bg:#fbf0d9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --accent: var(--accent-l, #b8431a); --on-accent:#ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --shadow: 0 1px 2px rgba(15,24,35,.05), 0 6px 20px rgba(15,24,35,.06);
  --r: 12px; --r-s: 8px;
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1219; --surface:#131b25; --surface-2:#18222e; --sunk:#0f161f;
    --ink:#e6ebf1; --ink-2:#b5bfcc; --muted:#8a95a5; --faint:#5d6978;
    --line:#243040; --line-2:#344357;
    --pos:#43c985; --neg:#ff7a6e; --warn:#f0b43c;
    --pos-bg:#12281d; --neg-bg:#2e1715; --warn-bg:#2b2211;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --accent: var(--accent-d, #ff7a45); --on-accent:#140a05;
    --shadow: 0 1px 0 rgba(255,255,255,.02);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1219; --surface:#131b25; --surface-2:#18222e; --sunk:#0f161f;
  --ink:#e6ebf1; --ink-2:#b5bfcc; --muted:#8a95a5; --faint:#5d6978;
  --line:#243040; --line-2:#344357;
  --pos:#43c985; --neg:#ff7a6e; --warn:#f0b43c;
  --pos-bg:#12281d; --neg-bg:#2e1715; --warn-bg:#2b2211;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --accent: var(--accent-d, #ff7a45); --on-accent:#140a05;
  --shadow: 0 1px 0 rgba(255,255,255,.02);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- шапка ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{font:700 17px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav-btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-2)}
.nav-btn:hover{border-color:var(--line-2);color:var(--ink)}
.nav-btn[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nav-btn.plain{padding:6px 14px}
.badge{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:999px;background:var(--sunk);font:600 11px/1 var(--f-mono);color:var(--ink-2)}
.nav-btn[aria-current="true"] .badge{background:var(--accent);color:var(--on-accent)}

/* ---------- заголовок бизнеса ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;padding-block:28px 18px}
.hero-badge{width:76px;height:76px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 18px/1 var(--f-mono);letter-spacing:-.02em;text-align:center}
.hero h1{font:700 clamp(24px,3.4vw,36px)/1.15 var(--f-display);letter-spacing:-.02em}
.hero .tagline{margin-top:8px;color:var(--ink-2);font-size:17px;max-width:68ch}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:14px}.hero-badge{width:56px;height:56px;border-radius:14px;font-size:14px}}

/* ---------- вкладки ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 14px 11px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:baseline}
.tab i{font-style:normal;font:600 12px/1 var(--f-mono);color:var(--faint)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] i{color:var(--accent)}
.pane{padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}

/* ---------- общие блоки ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-title{font:600 13px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.section-h{font:700 clamp(19px,2.2vw,24px)/1.25 var(--f-display);letter-spacing:-.015em}
.lead{font-size:clamp(18px,2vw,21px);line-height:1.5;max-width:66ch;color:var(--ink)}
.prose{max-width:68ch;color:var(--ink-2)}
.prose b{color:var(--ink)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.grid-pair{grid-template-columns:1fr}}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none;min-height:44px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted);max-width:75ch}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.pos{background:var(--pos-bg);color:var(--pos)}
.pill.neg{background:var(--neg-bg);color:var(--neg)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
details.rules{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.rules ul{margin:10px 0 2px;padding-left:20px;display:grid;gap:6px;color:var(--ink-2);font-size:15px}

/* ---------- суть ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.fact b{font:700 22px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.fact span{font-size:14px;color:var(--muted);line-height:1.4}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.flow-node{flex:1 1 0;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:4px}
.flow-node b{font-size:16px}
.flow-node span{font-size:13px;color:var(--muted);line-height:1.4}
.flow-node.you{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.flow-node.you::before{content:"Вы здесь";font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.flow-link{flex:0 0 132px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 8px;text-align:center;font-size:12.5px;line-height:1.35;color:var(--ink-2);gap:6px}
.flow-link::after{content:"";display:block;width:100%;height:2px;background:linear-gradient(90deg,var(--line-2),var(--accent));clip-path:polygon(0 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,0 100%);}
@media (max-width:760px){
  .flow{flex-direction:column}
  .flow-node{min-width:0}
  .flow-link{flex:0 0 auto;flex-direction:row;justify-content:flex-start;padding:8px 0 8px 18px;text-align:left;border-left:2px solid var(--line-2);margin-left:18px}
  .flow-link::after{display:none}
  .flow-link::before{content:"↓";color:var(--accent);font-weight:700}
}
.block{padding:18px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.block h3{font-size:17px}
.block p{color:var(--ink-2);font-size:15.5px}

/* ---------- экономика ---------- */
.econ{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.econ{grid-template-columns:1fr}}
.inputs{display:flex;flex-direction:column;gap:14px}
.inp{display:flex;flex-direction:column;gap:4px}
.inp-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.inp label{font-size:14px;font-weight:500;color:var(--ink-2)}
.inp output{font:600 14px/1 var(--f-mono);color:var(--ink);white-space:nowrap}
.inp small{font-size:12.5px;color:var(--muted);line-height:1.35}
input[type=range]{width:100%;accent-color:var(--accent);height:26px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:3px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.result-big{display:flex;flex-direction:column;gap:2px}
.result-big b{font:700 clamp(28px,4vw,40px)/1.1 var(--f-display);letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.kpi span{font-size:13px;color:var(--muted);line-height:1.3}
.kpi b{font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;color:var(--muted);line-height:1.35}
.wf{display:flex;flex-direction:column;gap:6px}
.wf-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;font-size:14px}
.wf-row .lab{color:var(--ink-2);line-height:1.3}
.wf-row.total .lab{font-weight:700;color:var(--ink)}
.wf-track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.wf-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.wf-bar{position:absolute;top:3px;bottom:3px;border-radius:3px}
.wf-row.in .wf-bar{background:var(--pos)}
.wf-row.out .wf-bar{background:var(--neg);opacity:.85}
.wf-row.total .wf-bar{background:var(--ink);top:1px;bottom:1px}
.wf-row .val{font:600 13.5px/1 var(--f-mono);text-align:right;min-width:92px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.wf-row{grid-template-columns:1fr auto;row-gap:4px}.wf-track{grid-column:1/-1;grid-row:2}}

/* ---------- графики ---------- */
.chart{position:relative;width:100%;min-height:120px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11.5px var(--f-body);fill:var(--muted)}
.chart .tick-future{fill:var(--faint)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-2);stroke-width:1}
.chart .xhair{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.chart .endlabel{font:600 12px var(--f-mono);fill:var(--ink)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:13px;min-width:120px;display:none}
.tip .t-x{color:var(--muted);font-size:12px;margin-bottom:4px}
.tip .t-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip .t-row i{display:inline-block;width:12px;height:2px;border-radius:2px}
.tip .t-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tip .t-row span{color:var(--muted)}
.tip .t-mark{margin-top:4px;font-size:12px;color:var(--ink-2)}
.chart-title{font-size:14px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* ---------- игра ---------- */
.game-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.game-grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:640px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st span{font-size:12.5px;color:var(--muted)}
.st b{font:600 18px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.st small{font-size:12px;color:var(--muted)}
.news{border-left:4px solid var(--accent)}
.news h3{font:700 20px/1.25 var(--f-display);letter-spacing:-.015em}
.news p{color:var(--ink-2)}
.mood{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mood-scale{display:inline-grid;grid-template-columns:repeat(5,22px);gap:3px}
.mood-scale i{height:8px;border-radius:2px;background:var(--sunk)}
.mood-scale i.on{background:var(--ink-2)}
.mood-scale i.on.m-2,.mood-scale i.on.m-1{background:var(--neg)}
.mood-scale i.on.m1,.mood-scale i.on.m2{background:var(--pos)}
.mood b{color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 16px;margin:0}
.metrics div{display:flex;flex-direction:column;gap:1px}
.metrics dt{font-size:12.5px;color:var(--muted)}
.metrics dd{margin:0;font:600 15px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.recap{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-s);padding:12px 14px;font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.recap .alert{color:var(--neg);font-weight:600}
.unit{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.unit-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.unit-head b{font-size:16px}
.unit-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:6px 14px;font-size:14px}
.unit-kv span{color:var(--muted);display:block;font-size:12.5px}
.unit-kv b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.unit-notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:grid;gap:3px}
.unit-notes li.warn{color:var(--warn)}
.fin{display:flex;flex-direction:column;gap:8px}
.fin label{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;background:var(--surface)}
.fin label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fin input{margin-top:4px;accent-color:var(--accent)}
.fin b{font-size:15px}
.fin small{grid-column:2;color:var(--muted);font-size:13px;line-height:1.4}
.msg{min-height:0;font-size:14px;color:var(--neg);font-weight:500}
.next{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px;border-radius:14px;border:1px solid var(--line)}
.next.done{position:static}
.next .btn.primary{flex:1 1 240px;font-size:16px;min-height:50px}
.table-wrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.ledger th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.results{border:2px solid var(--accent)}

ul.lessons{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);max-width:75ch}

.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}

  unit: {

      { label: '2020', title: 'Заголовок', tag: 'Метка', mood: 0, news: 'Что известно в январе.', outcome: 'Что случилось за год.',

  profile: {

<script id="engine">
'use strict';
const BUSINESSES = [];
function registerBusiness(b){ BUSINESSES.push(b); }

/* ---------- форматирование и утилиты (доступны и в описаниях бизнесов) ---------- */
const _nf = {};
function num(v, d = 0){ if(!_nf[d]) _nf[d] = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: d }); return _nf[d].format(v); }
function money(v, cur = '$', o = {}){
  if(v == null || !isFinite(v)) return '—';
  const neg = v < 0, a = Math.abs(v); let s;
  if(o.full || a < 1e4) s = cur + num(Math.round(a));
  else if(a < 1e6) s = cur + num(a / 1e3, a < 1e5 ? 1 : 0) + ' тыс';
  else if(a < 1e9) s = cur + num(a / 1e6, a < 1e7 ? 2 : 1) + ' млн';
  else s = cur + num(a / 1e9, 1) + ' млрд';
  return (neg ? '−' : (o.sign && v > 0 ? '+' : '')) + s;
}
function pct(v, d = 1, o = {}){
  if(v == null || !isFinite(v)) return '—';
  return (v < 0 ? '−' : (o.sign && v > 0 ? '+' : '')) + num(Math.abs(v * 100), d) + '%';
}
function plural(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10; return (a > 10 && a < 20) ? many : b === 1 ? one : (b >= 2 && b <= 4) ? few : many; }
function annuity(bal, r, n){ if(n <= 0) return bal; if(Math.abs(r) < 1e-9) return bal / n; return bal * r / (1 - Math.pow(1 + r, -n)); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function sum(arr, f = x => x){ return arr.reduce((a, x) => a + f(x), 0); }
function netOfLines(lines){ return sum(lines, l => l.kind === 'in' ? l.v : l.kind === 'out' ? -l.v : 0); }
function makeRng(seed){
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.normal = () => { let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  return r;
}
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if(props) for(const [k, v] of Object.entries(props)){
    if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'html') e.innerHTML = v;          // только для текстов из описаний бизнесов (доверенный источник)
    else if(k === 'text') e.textContent = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(const k of kids.flat(Infinity)){ if(k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const store = {
  get(k){ try { const v = localStorage.getItem('anatomy.' + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem('anatomy.' + k, JSON.stringify(v)); } catch(e){} }
};
/* Тексты бизнеса могут содержать {{имя}} — значения берутся из b.vars(), посчитанных по той же модели */
function bvars(b){ if(!b._vars){ b._vars = {}; try { b._vars = b.vars ? b.vars() : {}; } catch(e){ console.error(e); } } return b._vars; }
function tx(b, s){ if(typeof s !== 'string') return s; const v = bvars(b); return s.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in v ? v[k] : m)); }

/* ---------- состояние приложения ---------- */
const App = { biz: null, view: 'biz', tab: 'essence', games: {}, calc: {}, calcOpen: {}, tasks: {}, quiz: {}, buyFin: {}, msg: '' };
const TABS = [
  { id: 'essence', label: 'Суть', has: b => !!b.essence },
  { id: 'economy', label: 'Экономика', has: b => !!b.unit },
  { id: 'game', label: 'Игра', has: b => !!b.game },
  { id: 'traps', label: 'Ловушки', has: b => !!(b.traps && b.traps.length) },
  { id: 'quiz', label: 'Тест', has: b => !!(b.quiz && b.quiz.length) },
  { id: 'gloss', label: 'Словарь и источники', has: b => !!((b.glossary && b.glossary.length) || (b.sources && b.sources.length)) }
];
const PASSPORT = [
  { id: 'client', q: 'Кто клиент и за что платит' }, { id: 'unit', q: 'Единица бизнеса' }, { id: 'revenue', q: 'Что определяет выручку' },
  { id: 'costs', q: 'Куда уходят деньги' }, { id: 'capital', q: 'Сколько нужно капитала' }, { id: 'growth', q: 'Что ограничивает рост' },

  // графики: известное на момент решения — до текущего года, реализованное — до прошлого

    text: tr.kind === 'buy' ? `▲ покупка №${tr.id}` : tr.kind === 'forced' ? `▼ срочная продажа №${tr.id}` : `▼ продажа №${tr.id}` }));
  (G.charts || [{ title: 'Цена', series: [{ key: 'price', label: 'Цена' }], fmt: 'money' }]).forEach((c, ci) => {

  root.append(h('div', { class: 'game-grid' },

/* Итоги прожитого года: что произошло, почему изменился поток, что дал бы другой выбор */
function renderRecap(b, S){
  const G = b.game, ps = gPeriods(b, S), last = S.log[S.log.length - 1], prevRow = S.log.length > 1 ? S.log[S.log.length - 2] : null;
  const Pl = ps[last.t], cur = b.cur || '$', box = h('div', { class: 'recap', 'aria-live': 'polite' });
  box.append(h('div', null, h('b', null, `${last.label} — итоги года`)));
  if(Pl.outcome) box.append(h('div', { class: 'outcome', html: tx(b, Pl.outcome) }));
  const rm = (G.metrics || []).filter(mt => mt.realized);
  if(rm.length) box.append(h('div', null, rm.map((mt, i) => [i ? ' · ' : '', mt.label + ': ', h('b', null, mt.get(Pl, S)), estMark(Pl, mt.key)])));
  box.append(h('div', null, `Выручка ${money(last.rev, cur)}, расходы ${money(last.costs + last.oneoff, cur)}, банку ${money(last.interest + last.principal, cur)}`,
    last.deposit ? `, проценты по депозиту ${money(last.deposit, cur, { sign: true })}` : '', '. Денежный поток за год: ',
    h('b', { class: last.net - last.oneoff < 0 ? 'neg' : 'pos' }, money(last.net - last.oneoff, cur, { sign: true })), '.'));
  if(prevRow && prevRow.units && last.units){
    const pu = r => ({ rev: r.rev / r.units, costs: r.costs / r.units, op: r.op / r.units });
    const a = pu(prevRow), c = pu(last), ch = (x, y) => y ? x / y - 1 : null;
    const dr = ch(c.rev, a.rev), dc = ch(c.costs, a.costs);
    let why = `${G.unit.per || 'На один объект'} к прошлому году: выручка ${pct(dr, 0, { sign: true })}, текущие расходы ${pct(dc, 0, { sign: true })}, `;
    if(a.op > 0 && c.op > 0){
      const dop = ch(c.op, a.op); why += `операционный поток ${pct(dop, 0, { sign: true })}.`;
      if(dr != null && Math.abs(dr) > 0.05 && Math.abs(dop) > 1.6 * Math.abs(dr)) why += ' Поток меняется сильнее выручки, потому что большая часть расходов постоянна: это операционный рычаг.';
    } else why += `операционный поток: было ${money(a.op, cur)}, стало ${money(c.op, cur)}.`;
    box.append(h('div', { class: 'why' }, why));
  }
  for(const al of last.alts){
    if(Math.abs(al.diff) < 1000) continue;
    const mName = id => (G.modes.find(m => m.id === id) || {}).label || id;
    box.append(h('div', { class: 'alt' }, `${G.unit.One} №${al.id}: режим «${mName(al.mode)}» дал на ${money(Math.abs(al.diff), cur)} ${al.diff > 0 ? 'больше' : 'меньше'}, чем дал бы «${mName(al.alt)}» в тех же условиях${G.altNote ? ' ' + G.altNote : ''}.`));
  }
  for(const nt of last.notes) box.append(h('div', { class: nt.alert ? 'alert' : '' }, nt.text));
  return box;
}

function renderResults(b, S){
  const G = b.game, nw = gNet(b, S), start = G.startCash, profit = nw - start, cur = b.cur || '$', ps = gPeriods(b, S);
  const bench = gBenchmarks(b, S.scn), bestB = Math.max(...bench.map(x => x.value)), dep = bench[0].value;
  let title, text;
  if(S.bankrupt){ title = 'Банкротство'; text = 'Обязательства оказались больше, чем стоили активы. Чаще всего так заканчивается долг, взятый не в той фазе цикла, без запаса денег.'; }
  else if(nw >= bestB){ title = 'Вы обыграли все ориентиры'; text = 'Результат выше пассивных стратегий. Ниже видно, откуда он взялся и насколько близко вы подходили к нехватке денег.'; }
  else if(nw > dep){ title = 'Лучше депозита, но не лучше всех'; text = 'Результат выше безрискового, но одна из простых стратегий дала больше. Сравните цифры ниже.'; }
  else { title = 'Депозит оказался лучше'; text = 'Деньги, просто лежавшие под процент, принесли больше. В капиталоёмком бизнесе это частый итог при неудачной цене входа.'; }
  const all = [{ label: 'Ваш результат', value: nw, you: true }].concat(bench);
  const mx = Math.max(...all.map(x => x.value), 1);
  const bars = h('div', { class: 'bars' }, all.map(x => h('div', { class: 'bar-row' + (x.you ? ' you' : '') },
    h('div', { class: 'lab' }, x.label), h('div', { class: 'track' }, h('div', { class: 'fill', style: `width:${clamp(x.value / mx * 100, 0, 100)}%` })),
    h('div', { class: 'val' }, `${money(x.value, cur)} · ×${num(x.value / start, 2)}`))));
  const a = S.acc, capital = gCapital(b, S);
  const line = (l, v, cls) => h('div', { class: cls || '' }, h('span', null, l), h('b', { class: v < 0 ? 'neg' : 'pos' }, money(v, cur, { sign: true })));
  const decomp = h('div', { class: 'decomp' },
    line(G.opLabel || 'Работа актива (выручка минус текущие расходы)', a.op), line('Проценты банку', -a.interest), line('Проценты по депозиту', a.deposit),
    line('Разовые траты (ремонт, переоборудование)', -a.oneoff), line('Сделки и переоценка (продажа или цена сейчас минус покупка, с комиссиями)', capital),
    line('Итого прибыль за игру', profit, 'sum'));
  const prices = ps.map(p => p.price), iMin = prices.indexOf(Math.min(...prices)), iMax = prices.indexOf(Math.max(...prices));
  const lbl = t => (ps[Math.min(t, ps.length - 1)] || {}).label;
  const trades = [];
  for(const tr of S.trades) if(tr.kind !== 'buy') trades.push(`№${tr.id}: куплено в ${lbl(tr.buyT)} за ${money(tr.buyPrice, cur)}, ${tr.kind === 'forced' ? 'срочно продано' : 'продано'} ${tr.t >= ps.length ? 'в конце игры' : 'в ' + lbl(tr.t)} за ${money(tr.price, cur)} (×${num(tr.price / tr.buyPrice, 2)}).`);
  const P = gP(b, S);
  for(const u of S.units) trades.push(`№${u.id}: куплено в ${lbl(u.t0)} за ${money(u.price, cur)}, в конце игры стоит ${money(gUnitPrice(b, S, u, P), cur)}.`);
  const lessons = [];
  if(!S.trades.length) lessons.push('Вы так ничего и не купили. Это тоже решение: вы отказались и от риска, и от шанса на цикле.');
  if(S.trades.some(t => t.kind === 'forced')) lessons.push('Была срочная продажа. Долг сам по себе не губит; губит нехватка денег в момент, когда рынок слабый и покупателей мало.');
  if(a.op > 0 || capital > 0) lessons.push(capital > a.op
    ? 'Сделки и переоценка дали больше, чем работа актива. Посмотрите, в каком году вы покупали: цена входа определила результат.'
    : 'Работа актива дала больше, чем сделки. Посмотрите в журнале, какие годы принесли основной поток: обычно это несколько лучших лет цикла.');
  if(S.minCash) lessons.push(`Минимум денег на счёте за игру: ${money(S.minCash.v, cur)} (${S.minCash.label}). Это ваш запас прочности: чем он ближе к нулю, тем сильнее результат зависел от удачи.`);
  return h('section', { class: 'panel results' },
    h('span', { class: 'eyebrow' }, 'Итог игры' + (S.scn.kind === 'random' ? ` · случайный цикл №${S.scn.seed}` : '')),
    h('h2', null, title), h('p', { class: 'prose' }, text),
    h('div', { class: 'grid-2' },
      h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'С чем сравнить'), bars,
        h('p', { class: 'note' }, `Старт: ${money(start, cur)}. Задним числом самая низкая цена для покупки была в ${ps[iMin].label} (${money(prices[iMin], cur)}), самая высокая — в ${ps[iMax].label} (${money(prices[iMax], cur)}).`)),
      h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'Откуда взялся результат'), decomp)),
    trades.length ? h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'Ваши сделки'), h('ul', { class: 'lessons' }, trades.map(t => h('li', null, t)))) : null,
    h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'Выводы'), h('ul', { class: 'lessons' }, lessons.concat(G.lessons || [], S.scn.kind === 'random' ? [] : (G.historyLessons || [])).map(t => h('li', { html: tx(b, t) })))));

/* ---------- Проверка модели ---------- */
function runChecks(){
  const out = [], ids = new Set();
  for(const b of BUSINESSES){
    const add = (name, st, msg) => out.push({ biz: b.name || b.id, name, st, msg: msg || '' });
    add('id уникален и без пробелов', b.id && /^[a-z0-9_-]+$/i.test(b.id) && !ids.has(b.id) ? 'ok' : 'bad', b.id); ids.add(b.id);
    add('Есть название и главная мысль', b.name && b.essence && b.essence.thesis ? 'ok' : 'bad');
    const missM = META.filter(m => !(b.meta && b.meta[m.id])).map(m => m.label);
    add('Метаданные: рынок, валюта, налоги, дата данных', missM.length ? 'warn' : 'ok', missM.length ? 'нет: ' + missM.join(', ') : '');
    const missP = PASSPORT.filter(q => !(b.essence && b.essence.passport && b.essence.passport[q.id])).map(q => q.q);
    add('Паспорт бизнеса заполнен', missP.length ? 'warn' : 'ok', missP.length ? 'нет: ' + missP.join('; ') : '');
    try {
      const unresolved = JSON.stringify([b.tagline, b.essence, b.traps, b.quiz]).match(/\{\{\w+\}\}/g);
      const v = bvars(b), bad = (unresolved || []).filter(x => !(x.slice(2, -2) in v));
      add('Все {{переменные}} в текстах посчитаны', bad.length ? 'bad' : 'ok', bad.join(' '));
    } catch(e){ add('Все {{переменные}} в текстах посчитаны', 'bad', e.message); }
    if(b.unit){
      try {
        const U = b.unit, d = calcDefaults(b), bad = [];
        const probe = (vv, where) => { const r = U.compute(Object.assign({}, vv)); if(!isFinite(r.result) || r.lines.some(l => l.v != null && !isFinite(l.v))) bad.push(where); };
        probe(d, 'по умолчанию');
        for(const inp of U.inputs) if(!inp.options) for(const x of [inp.min, (inp.min + inp.max) / 2, inp.max]) probe(Object.assign({}, d, { [inp.id]: x }), `${inp.label} = ${x}`);
        for(const inp of U.inputs) if(inp.options) for(const o of inp.options) probe(Object.assign({}, d, { [inp.id]: o.id }), `${inp.label} = ${o.label}`);
        add('Калькулятор: нет пустых и бесконечных чисел', bad.length ? 'bad' : 'ok', bad.slice(0, 3).join('; '));
        const tbad = [];
        (U.tasks || []).forEach((t, i) => {
          const base = Object.assign(calcDefaults(b), t.base || {}), after = Object.assign({}, base, typeof t.set === 'function' ? t.set(base) : (t.set || {}));
          const dd = { before: U.compute(Object.assign({}, base)), after: U.compute(Object.assign({}, after)), v0: base, v1: after };
          const right = t.options.filter(o => o.test(dd)).length;
          if(right !== 1) tbad.push(`задание ${i + 1}: верных вариантов ${right}`);
        });
        if(U.tasks) add('Задания: ровно один верный ответ по модели', tbad.length ? 'bad' : 'ok', tbad.join('; '));
      } catch(e){ add('Калькулятор считается', 'bad', e.message); }
    }
    if(b.game){
      const G = b.game, scns = [{ kind: 'history' }];
      if(G.randomScenario) for(let seed = 1; seed <= 8; seed++) scns.push({ kind: 'random', seed });
      let runs = 0; const errs = [];
      try {
        for(const scn of scns){
          const ps = gPeriodsOf(b, scn);
          ps.forEach((p, i) => { for(const [k, x] of Object.entries(p)) if(typeof x === 'number' && !isFinite(x)) errs.push(`${scn.kind} ${p.label}: ${k}`); if(!(p.price > 0)) errs.push(`${scn.kind} ${p.label}: цена`); });
          const fins = ['cash'].concat(G.loan ? G.loan.types.map(t => t.id) : []);
          const strategies = [() => {}];
          for(const f of fins) for(let t0 = 0; t0 < ps.length; t0++) strategies.push((S, A) => { if(S.t === t0) A.buy(f); });
          for(let k = 0; k < 12; k++){
            const rng = makeRng(1000 + k);
            strategies.push((S, A) => {
              if(rng() < 0.35) A.buy(fins[Math.floor(rng() * fins.length)]);
              for(const u of S.units.slice()){
                if(rng() < 0.12) { A.sell(u.id); continue; }
                if(G.modes && rng() < 0.25) A.mode(u.id, G.modes[Math.floor(rng() * G.modes.length)].id);
                const acts = A.actions(u); if(acts.length && rng() < 0.3) A.action(u.id, Math.floor(rng() * acts.length));
              }
            });
          }
          for(const st of strategies){ const S = gPlay(b, st, scn); runs++; const e = gCheck(b, S); if(e) errs.push(`${scn.kind}${scn.seed ? ' №' + scn.seed : ''}: ${e}`); }
        }
      } catch(e){ errs.push(e.message); }
      add(`Игра: деньги и капитал сходятся (${runs} партий, сценариев: ${scns.length})`, errs.length ? 'bad' : 'ok', errs.slice(0, 3).join('; '));

    }
    for(const t of (b.selfTests || [])){
      let r; try { r = t.run(); } catch(e){ r = e.message; }
      add(t.name, r === true ? 'ok' : 'bad', r === true ? '' : String(r));
    }
  }

}

    h('div', { class: 'col' }, h('span', { class: 'eyebrow' }, 'Для авторов шаблона'), h('h1', { class: 'section-h', style: 'font-size:clamp(24px,3vw,32px)' }, 'Проверка модели'),
      h('p', { class: 'prose' }, 'Страница прогоняет все бизнесы: заполненность описаний, калькулятор на крайних значениях, задания и сотни игровых партий. В каждой партии проверяется, что деньги на счёте равны сумме всех движений, а изменение капитала раскладывается на работу актива, проценты, депозит, разовые траты и сделки.'),

   БИЗНЕС 1. КОНТЕЙНЕРОВОЗ-ФИДЕР

{
  const NORM = 10800;   // медиана ставки 1 700 TEU за 2016–2025 по Clarksons ($10 825/сутки)

  const shipYear = x => {
    const revenue = x.rate * x.days, comm = revenue * x.comm;

    const life = Math.max(1, 25 - age), norm = NORM * 1.1 * (1 - clamp(ob - 0.15, -0.1, 0.3) * 0.8), floor = scrap * LDT;
    let pv = 0, r = q;

      randomScenario(rng){
        const n = 10, ps = [], LV = { T: 0.62, N: 1 }, TR = { T: [ .6, .32 ], N: [ .25, .5 ], B: [ .3, .4 ] };
        const pick = r => { const x = rng(); return x < TR[r][0] ? 'T' : x < TR[r][0] + TR[r][1] ? 'N' : 'B'; };
        let reg = rng() < 0.5 ? 'T' : 'N', lastRate = Math.round(NORM * LV[reg] * Math.exp(rng.normal() * 0.1) / 100) * 100;
        let ob = 0.10 + rng() * 0.08, base = 0.005 + rng() * 0.03, scrap = Math.round(300 + rng() * 150), opex = 6300, prevPrice = null, prevQuote = null;
        for(let i = 0; i < n; i++){
          const age = 12 + i, quote = Math.round(lastRate * Math.exp(rng.normal() * 0.08) / 100) * 100;
          let r2 = pick(reg);
          if(r2 === 'B' && ob > 0.25 && rng() < 0.5) r2 = 'N';   // большой заказ новых судов гасит бум
          const lvl = r2 === 'B' ? 2.2 + rng() * 1.8 : LV[r2];
          const rate = Math.round(clamp(NORM * lvl * Math.exp(rng.normal() * 0.12), 4500, 70000) / 100) * 100;
          const price = shipValue(quote, ob, age, opex, scrap), q = quote / NORM, be = opex * 365 / (350 * 0.95);
          const title = i === 0 ? 'Вы входите в рынок' : quote > prevQuote * 1.15 ? 'Ставки растут' : quote < prevQuote * 0.85 ? 'Ставки падают' : 'Без больших перемен';
          ps.push({ label: `${i + 1}-й год`, tick: String(i + 1), age, title,
            tag: quote < be ? 'Ставка ниже расходов' : q < 1 ? 'Слабый рынок' : q < 1.6 ? 'Нормальный рынок' : 'Высокие ставки',
            mood: q < 0.7 ? -2 : q < 0.9 ? -1 : q < 1.4 ? 0 : q < 2.2 ? 1 : 2,
            news: `Ставка на начало года — ${money(quote)} в сутки${i ? `, в среднем за прошлый год было ${money(lastRate)}` : ''}. Судно вашего типа (${age} лет) стоит ${money(price)}${prevPrice ? ` (год назад ${money(prevPrice)})` : ''}. Заказано новых судов: ${pct(ob, 0)} флота${ob > 0.25 ? ' — много, через 2–3 года они выйдут на рынок' : ob < 0.12 ? ' — мало, предложение почти не растёт' : ''}. ${q < 0.8 ? 'Линии отменяют рейсы, старые суда уходят на слом.' : q > 1.8 ? 'В отраслевых новостях — рекорды и очереди на верфях.' : 'Рынок спокоен.'}${age === 15 || age === 20 ? ` Судам в этом году ${age} лет: обязательное докование.` : ''}`,
            outcome: `Средняя ставка за год — ${money(rate)}: ${rate >= quote ? 'выше' : 'ниже'} начала года на ${pct(Math.abs(rate / quote - 1), 0)}. ${r2 === 'B' ? 'Спрос неожиданно вырос: порты перегружены, суда стоят в очередях.' : r2 === 'T' ? 'Спрос просел, часть флота простаивает.' : 'Год прошёл без потрясений.'}`,
            price, quote, rate, opex: Math.round(opex), idle: rate < NORM ? Math.round(clamp((1 - rate / NORM) * 60, 0, 30)) : 0, scrap,
            base, deposit: Math.max(0, base - 0.002), survey: (age === 15 || age === 20) ? { cost: 1.5e6, days: 25 } : null });
          prevQuote = quote; prevPrice = price; lastRate = rate; reg = r2;
          ob = clamp(ob * 0.75 + (rate > 1.5 * NORM ? 0.08 + 0.06 * rng() : 0.015), 0.05, 0.45);
          base = clamp(base + rng.normal() * 0.008, 0.001, 0.055); scrap = Math.round(clamp(scrap * (0.85 + 0.3 * rng()), 250, 650)); opex *= 1.02;
        }
        const fq = Math.round(lastRate * Math.exp(rng.normal() * 0.08) / 100) * 100;
        ps.final = { label: 'Итог', price: shipValue(fq, ob, 22, opex, scrap), quote: fq };
        return ps;

          news: 'Жильцы домов жалуются на шум. С этого года посуточные квартиры нужно регистрировать, за нарушения — штрафы. Часть владельцев возвращается к долгосрочной аренде.',

      randomScenario(rng){
        const n = 12, ps = [];
        let base = 0.05 + rng() * 0.02, rent = 1000, price = null, prevBase = null, prevPrice = null, shocked = false, shockLeft = 0, regDone = false, infl = 0.04;
        for(let i = 0; i < n; i++){
          let flavor, tag, mood = 0;
          if(i > 0) rent = Math.round(rent * (1 + infl * (base > 0.1 ? 0.5 : 0.9) + rng.normal() * 0.01) / 10) * 10;
          if(shockLeft > 0){ shockLeft--; base = Math.max(0.05, base - 0.025 - rng() * 0.02); flavor = 'Центробанк понемногу снижает ставку, но она всё ещё высокая.'; tag = 'Ставки снижаются'; mood = -1; }
          else if(i >= 3 && !shocked && (rng() < 0.2 || i === 8)){ base = Math.min(0.2, base + 0.06 + rng() * 0.05); shocked = true; shockLeft = 1 + Math.floor(rng() * 2); flavor = `В январе центробанк резко поднял ставку до ${pct(base)}: инфляция разогналась.`; tag = 'Шок ставок'; mood = -1; }
          else {
            const nb = clamp(base + rng.normal() * 0.008 - (base - 0.05) * 0.4, 0.02, 0.2);
            flavor = nb < base - 0.004 ? 'Центробанк снижает ставку, ипотека дешевеет.' : nb > base + 0.004 ? 'Центробанк немного поднял ставку.' : 'Ставки почти не изменились.';
            base = nb; tag = base < 0.04 ? 'Дешёвые деньги' : 'Спокойный рынок';
          }
          infl = base > 0.1 ? 0.09 + rng() * 0.03 : 0.025 + rng() * 0.02;
          const mort = base + 0.02, cap = clamp(0.08 + 0.5 * (mort - 0.08), 0.05, 0.12), fair = rent * 12 / cap;
          price = Math.round((price == null ? fair : price + 0.45 * (fair - price)) * Math.exp(rng.normal() * 0.02) / 1000) * 1000;
          const chg = prevPrice ? price / prevPrice - 1 : 0;
          if(tag !== 'Шок ставок' && tag !== 'Ставки снижаются'){
            mood = chg > 0.08 ? 2 : chg > 0.03 ? 1 : chg < -0.05 ? -2 : chg < -0.01 ? -1 : 0;
            if(mood === 2) tag = 'Бум цен'; if(mood < 0) tag = 'Цены падают';
          }
          const high = base > 0.1;
          let occ = clamp(0.62 + rng.normal() * 0.05 - (high ? 0.1 : 0), 0.35, 0.85), adrK = high ? 0.92 : 1, strShock = null, extra = '';
          if(rng() < 0.15){ occ = 0.88; adrK = 1.35; }
          if(!regDone && i >= 4 && rng() < 0.1){ regDone = true; strShock = { occ: 0.7, cost: 1500 }; extra = ' С этого года посуточные квартиры нужно регистрировать, за нарушения — штрафы.'; tag = 'Новые правила'; }
          const vac = Math.round(clamp(3 + (high ? 2.5 : 0) + rng.normal() * 0.7, 1.5, 8) * 2) / 2, deposit = Math.max(0.01, base - 0.005);
          ps.push(P(i + 1, { title: `Ставка ${pct(base)}, квартира ${money(price)}`, tag, mood, price, rent, base, mort, deposit, vac, occ, adrK, strShock,
            news: `Учётная ставка центробанка — ${pct(base)}${prevBase != null ? ` (год назад ${pct(prevBase)})` : ''}. Ипотека: фиксированная ${pct(mort)}, плавающая ${pct(base + FLOAT)}; вклады — ${pct(deposit)}. Квартира стоит ${money(price)}${prevPrice ? ` (год назад ${money(prevPrice)})` : ''}, аренда — ${money(rent)} в месяц: грязная доходность ${pct(rent * 12 / price)}. ${flavor}${extra}`,
            outcome: `${occ >= 0.88 ? 'Туристический сезон оказался рекордным. ' : ''}${high ? 'Доходы людей под давлением, сделок мало.' : 'Год прошёл без потрясений.'}` }));
          prevBase = base; prevPrice = price;
        }
        return ps;
      },

          const replace = p.price * (1 + G.buyCost) - gUnitPrice(BIZ, S, u, p) * (1 - G.sellCost), reno = RENO * K(p);
          return replace > reno || `замена ${replace}, ремонт ${reno}`; } },
      { name: 'Калькулятор и игра считают год одной функцией (долгосрочная и посуточная)', run(){
          const p = BIZ.game.periods[0], k = K(p);
          for(const mode of [ 'ltr', 'str' ]){
            const g = BIZ.game.operate({ mode, data: { wear: 0 } }, p), gop = g.revenue - sum(g.costs, x => x[1]);
            const c = aptCompute(Object.assign(calcDefaults(BIZ), { mode, rent: p.rent, vac: p.vac, adr: p.rent / 30 * 2.1, occ: p.occ * 100, plat: 15, mgmt: 25, clean: 25 * k, stay: 3, util: 1600 * k, ptax: 150 * k, maint: 1000 * k, agent: 35, tax: 4, reno: 0, ltv: 0 }));
            if(Math.abs(gop - c.result) > 1) return `${mode}: игра ${gop}, калькулятор ${c.result}`;
          }
          return true; } }
    ]
  };
  registerBusiness(BIZ);
}
