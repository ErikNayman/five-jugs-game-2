<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анатомия бизнеса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<!--
  АНАТОМИЯ БИЗНЕСА — шаблон интерактивного разбора бизнесов.
  Файл полностью автономный: без сборки и библиотек (шрифты Google подгружаются,
  если есть интернет; без него работают системные).

  КАК ДОБАВИТЬ СВОЙ БИЗНЕС
  1. Прокрутите файл вниз до блока <script id="businesses">.
  2. Скопируйте шаблон из блока <script type="text/plain" id="tpl-business">
     (или откройте в браузере вкладку «Добавить бизнес» и нажмите «Скопировать»).
  3. Вставьте его перед строкой «КОНЕЦ СПИСКА БИЗНЕСОВ» и заполните поля.
  4. Сохраните файл и обновите страницу. Движок сам построит все разделы.
  Любой раздел можно пропустить: если нет game, вкладки «Игра» не будет, и т.д.
-->
<style>
:root{
  color-scheme: light;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --sunk:#e3e8ee;
  --ink:#0f1823; --ink-2:#394556; --muted:#5f6b7c; --faint:#9aa4b2;
  --line:#d6dce4; --line-2:#bcc5d1;
  --pos:#12784a; --neg:#c0392b; --warn:#9a6200;
  --pos-bg:#e3f3ea; --neg-bg:#fbe7e4; --warn-bg:#fbf0d9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --accent: var(--accent-l, #b8431a); --on-accent:#ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --shadow: 0 1px 2px rgba(15,24,35,.05), 0 6px 20px rgba(15,24,35,.06);
  --r: 12px; --r-s: 8px;
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1219; --surface:#131b25; --surface-2:#18222e; --sunk:#0f161f;
    --ink:#e6ebf1; --ink-2:#b5bfcc; --muted:#8a95a5; --faint:#5d6978;
    --line:#243040; --line-2:#344357;
    --pos:#43c985; --neg:#ff7a6e; --warn:#f0b43c;
    --pos-bg:#12281d; --neg-bg:#2e1715; --warn-bg:#2b2211;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --accent: var(--accent-d, #ff7a45); --on-accent:#140a05;
    --shadow: 0 1px 0 rgba(255,255,255,.02);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1219; --surface:#131b25; --surface-2:#18222e; --sunk:#0f161f;
  --ink:#e6ebf1; --ink-2:#b5bfcc; --muted:#8a95a5; --faint:#5d6978;
  --line:#243040; --line-2:#344357;
  --pos:#43c985; --neg:#ff7a6e; --warn:#f0b43c;
  --pos-bg:#12281d; --neg-bg:#2e1715; --warn-bg:#2b2211;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --accent: var(--accent-d, #ff7a45); --on-accent:#140a05;
  --shadow: 0 1px 0 rgba(255,255,255,.02);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- шапка ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{font:700 17px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav-btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-2)}
.nav-btn:hover{border-color:var(--line-2);color:var(--ink)}
.nav-btn[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nav-btn.plain{padding:6px 14px}
.badge{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:999px;background:var(--sunk);font:600 11px/1 var(--f-mono);color:var(--ink-2)}
.nav-btn[aria-current="true"] .badge{background:var(--accent);color:var(--on-accent)}

/* ---------- заголовок бизнеса ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;padding-block:28px 18px}
.hero-badge{width:76px;height:76px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 18px/1 var(--f-mono);letter-spacing:-.02em;text-align:center}
.hero h1{font:700 clamp(24px,3.4vw,36px)/1.15 var(--f-display);letter-spacing:-.02em}
.hero .tagline{margin-top:8px;color:var(--ink-2);font-size:17px;max-width:68ch}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:14px}.hero-badge{width:56px;height:56px;border-radius:14px;font-size:14px}}

/* ---------- вкладки ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 14px 11px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:baseline}
.tab i{font-style:normal;font:600 12px/1 var(--f-mono);color:var(--faint)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] i{color:var(--accent)}
.pane{padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}

/* ---------- общие блоки ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-title{font:600 13px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.section-h{font:700 clamp(19px,2.2vw,24px)/1.25 var(--f-display);letter-spacing:-.015em}
.lead{font-size:clamp(18px,2vw,21px);line-height:1.5;max-width:66ch;color:var(--ink)}
.prose{max-width:68ch;color:var(--ink-2)}
.prose b{color:var(--ink)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.grid-pair{grid-template-columns:1fr}}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none;min-height:44px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted);max-width:75ch}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.pos{background:var(--pos-bg);color:var(--pos)}
.pill.neg{background:var(--neg-bg);color:var(--neg)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
details.rules{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.rules ul{margin:10px 0 2px;padding-left:20px;display:grid;gap:6px;color:var(--ink-2);font-size:15px}

/* ---------- суть ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.fact b{font:700 22px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.fact span{font-size:14px;color:var(--muted);line-height:1.4}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.flow-node{flex:1 1 0;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:4px}
.flow-node b{font-size:16px}
.flow-node span{font-size:13px;color:var(--muted);line-height:1.4}
.flow-node.you{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.flow-node.you::before{content:"Вы здесь";font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.flow-link{flex:0 0 132px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 8px;text-align:center;font-size:12.5px;line-height:1.35;color:var(--ink-2);gap:6px}
.flow-link::after{content:"";display:block;width:100%;height:2px;background:linear-gradient(90deg,var(--line-2),var(--accent));clip-path:polygon(0 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,0 100%);}
@media (max-width:760px){
  .flow{flex-direction:column}
  .flow-node{min-width:0}
  .flow-link{flex:0 0 auto;flex-direction:row;justify-content:flex-start;padding:8px 0 8px 18px;text-align:left;border-left:2px solid var(--line-2);margin-left:18px}
  .flow-link::after{display:none}
  .flow-link::before{content:"↓";color:var(--accent);font-weight:700}
}
.block{padding:18px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.block h3{font-size:17px}
.block p{color:var(--ink-2);font-size:15.5px}

/* ---------- экономика ---------- */
.econ{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.econ{grid-template-columns:1fr}}
.inputs{display:flex;flex-direction:column;gap:14px}
.inp{display:flex;flex-direction:column;gap:4px}
.inp-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.inp label{font-size:14px;font-weight:500;color:var(--ink-2)}
.inp output{font:600 14px/1 var(--f-mono);color:var(--ink);white-space:nowrap}
.inp small{font-size:12.5px;color:var(--muted);line-height:1.35}
input[type=range]{width:100%;accent-color:var(--accent);height:26px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:3px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.result-big{display:flex;flex-direction:column;gap:2px}
.result-big b{font:700 clamp(28px,4vw,40px)/1.1 var(--f-display);letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.kpi span{font-size:13px;color:var(--muted);line-height:1.3}
.kpi b{font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;color:var(--muted);line-height:1.35}
.wf{display:flex;flex-direction:column;gap:6px}
.wf-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;font-size:14px}
.wf-row .lab{color:var(--ink-2);line-height:1.3}
.wf-row.total .lab{font-weight:700;color:var(--ink)}
.wf-track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.wf-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.wf-bar{position:absolute;top:3px;bottom:3px;border-radius:3px}
.wf-row.in .wf-bar{background:var(--pos)}
.wf-row.out .wf-bar{background:var(--neg);opacity:.85}
.wf-row.total .wf-bar{background:var(--ink);top:1px;bottom:1px}
.wf-row .val{font:600 13.5px/1 var(--f-mono);text-align:right;min-width:92px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.wf-row{grid-template-columns:1fr auto;row-gap:4px}.wf-track{grid-column:1/-1;grid-row:2}}

/* ---------- графики ---------- */
.chart{position:relative;width:100%;min-height:120px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11.5px var(--f-body);fill:var(--muted)}
.chart .tick-future{fill:var(--faint)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-2);stroke-width:1}
.chart .xhair{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.chart .endlabel{font:600 12px var(--f-mono);fill:var(--ink)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:13px;min-width:120px;display:none}
.tip .t-x{color:var(--muted);font-size:12px;margin-bottom:4px}
.tip .t-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip .t-row i{display:inline-block;width:12px;height:2px;border-radius:2px}
.tip .t-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tip .t-row span{color:var(--muted)}
.tip .t-mark{margin-top:4px;font-size:12px;color:var(--ink-2)}
.chart-title{font-size:14px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* ---------- игра ---------- */
.game-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.game-grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:640px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st span{font-size:12.5px;color:var(--muted)}
.st b{font:600 18px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.st small{font-size:12px;color:var(--muted)}
.news{border-left:4px solid var(--accent)}
.news h3{font:700 20px/1.25 var(--f-display);letter-spacing:-.015em}
.news p{color:var(--ink-2)}
.mood{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mood-scale{display:inline-grid;grid-template-columns:repeat(5,22px);gap:3px}
.mood-scale i{height:8px;border-radius:2px;background:var(--sunk)}
.mood-scale i.on{background:var(--ink-2)}
.mood-scale i.on.m-2,.mood-scale i.on.m-1{background:var(--neg)}
.mood-scale i.on.m1,.mood-scale i.on.m2{background:var(--pos)}
.mood b{color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 16px;margin:0}
.metrics div{display:flex;flex-direction:column;gap:1px}
.metrics dt{font-size:12.5px;color:var(--muted)}
.metrics dd{margin:0;font:600 15px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.recap{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-s);padding:12px 14px;font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.recap .alert{color:var(--neg);font-weight:600}
.unit{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.unit-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.unit-head b{font-size:16px}
.unit-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:6px 14px;font-size:14px}
.unit-kv span{color:var(--muted);display:block;font-size:12.5px}
.unit-kv b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.unit-notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:grid;gap:3px}
.unit-notes li.warn{color:var(--warn)}
.fin{display:flex;flex-direction:column;gap:8px}
.fin label{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;background:var(--surface)}
.fin label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fin input{margin-top:4px;accent-color:var(--accent)}
.fin b{font-size:15px}
.fin small{grid-column:2;color:var(--muted);font-size:13px;line-height:1.4}
.msg{min-height:0;font-size:14px;color:var(--neg);font-weight:500}
.next{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px;border-radius:14px;border:1px solid var(--line)}
.next.done{position:static}
.next .btn.primary{flex:1 1 240px;font-size:16px;min-height:50px}
.table-wrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.ledger th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger tr.note td{font-family:var(--f-body);white-space:normal;text-align:left;color:var(--neg);font-size:13px;padding-top:0}
.ledger td.lbl{font-weight:600}
.results{border:2px solid var(--accent)}
.results h2{font:700 clamp(22px,3vw,30px)/1.2 var(--f-display);letter-spacing:-.02em}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:12px;align-items:center;font-size:14px}
.bar-row .track{height:14px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.bar-row .fill{position:absolute;left:0;top:0;bottom:0;background:var(--line-2);border-radius:4px}
.bar-row.you .fill{background:var(--accent)}
.bar-row.you .lab{font-weight:700}
.bar-row .val{font:600 13.5px/1 var(--f-mono);text-align:right;white-space:nowrap}
@media (max-width:520px){.bar-row{grid-template-columns:1fr auto}.bar-row .track{grid-column:1/-1;grid-row:2}}
.decomp{display:grid;gap:4px;font-size:14.5px;max-width:560px}
.decomp div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dotted var(--line-2);padding:4px 0}
.decomp div.sum{border-bottom:0;font-weight:700;border-top:1px solid var(--ink-2);padding-top:6px}
.decomp b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
ul.lessons{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);max-width:75ch}

/* ---------- ловушки, тест, словарь ---------- */
.trap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.trap .myth{font-weight:700;font-size:17px;line-height:1.35}
.trap .myth::before{content:"Миф";display:block;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--neg);margin-bottom:6px}
.trap .truth{color:var(--ink-2);font-size:15.5px}
.trap .truth::before{content:"На деле";display:block;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--pos);margin-bottom:6px}
.trap .fact-line{font:500 13px/1.45 var(--f-mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.q h3{font-size:17px;line-height:1.4;font-weight:600}
.q h3 span{font:600 12px/1 var(--f-mono);color:var(--muted);display:block;margin-bottom:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-s);padding:10px 14px;cursor:pointer;font-size:15px;line-height:1.4;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--pos);background:var(--pos-bg)}
.opt.wrong{border-color:var(--neg);background:var(--neg-bg)}
.explain{font-size:15px;color:var(--ink-2);border-left:3px solid var(--line-2);padding-left:12px}
.score{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
dl.gloss{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--line)}
dl.gloss dt,dl.gloss dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.gloss dt{font-weight:700;padding-right:16px}
dl.gloss dd{color:var(--ink-2)}
@media (max-width:620px){dl.gloss{grid-template-columns:1fr}dl.gloss dt{border-bottom:0;padding-bottom:0}}
ol.sources{margin:0;padding-left:22px;display:grid;gap:8px;color:var(--ink-2)}
ol.sources small{color:var(--muted)}

/* ---------- сравнение и добавление ---------- */
.cmp{border-collapse:collapse;width:100%;min-width:620px;font-size:14.5px}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font:700 15px/1.3 var(--f-body);color:var(--ink)}
.cmp tbody th{font-weight:600;color:var(--ink-2);width:26%}
.cmp tbody th small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2)}
.dots i.on{background:var(--ink-2);border-color:var(--ink-2)}
pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);padding:16px;overflow:auto;max-height:520px;font:13px/1.55 var(--f-mono);color:var(--ink);margin:0;white-space:pre}
ol.steps{margin:0;padding-left:22px;display:grid;gap:8px;max-width:75ch;color:var(--ink-2)}
footer.foot{border-top:1px solid var(--line);padding-block:22px 36px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.pane{animation:fade .25s ease-out}}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

<script id="engine">
'use strict';
const BUSINESSES = [];
function registerBusiness(b){ BUSINESSES.push(b); }

/* ---------- форматирование и утилиты (доступны и в описаниях бизнесов) ---------- */
const _nf = {};
function num(v, d = 0){
  const k = d; if(!_nf[k]) _nf[k] = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: d });
  return _nf[k].format(v);
}
function money(v, cur = '$', o = {}){
  if(v == null || !isFinite(v)) return '—';
  const neg = v < 0, a = Math.abs(v); let s;
  if(o.full || a < 1e4) s = cur + num(Math.round(a));
  else if(a < 1e6) s = cur + num(a / 1e3, a < 1e5 ? 1 : 0) + ' тыс';
  else if(a < 1e9) s = cur + num(a / 1e6, a < 1e7 ? 2 : 1) + ' млн';
  else s = cur + num(a / 1e9, 1) + ' млрд';
  return (neg ? '−' : (o.sign && v > 0 ? '+' : '')) + s;
}
function pct(v, d = 1, o = {}){
  if(v == null || !isFinite(v)) return '—';
  const s = num(Math.abs(v * 100), d) + '%';
  return (v < 0 ? '−' : (o.sign && v > 0 ? '+' : '')) + s;
}
function annuity(bal, r, n){ if(n <= 0) return bal; if(Math.abs(r) < 1e-9) return bal / n; return bal * r / (1 - Math.pow(1 + r, -n)); }
function plural(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10; return (a > 10 && a < 20) ? many : b === 1 ? one : (b >= 2 && b <= 4) ? few : many; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function sum(arr, f = x => x){ return arr.reduce((a, x) => a + f(x), 0); }

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if(props) for(const [k, v] of Object.entries(props)){
    if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'html') e.innerHTML = v;          // только для текстов из описаний бизнесов (доверенный источник)
    else if(k === 'text') e.textContent = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(const k of kids.flat(Infinity)){ if(k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const store = {
  get(k){ try { const v = localStorage.getItem('anatomy.' + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem('anatomy.' + k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- состояние приложения ---------- */
const App = { biz: null, view: 'biz', tab: 'essence', games: {}, calc: {}, quiz: {}, buyFin: {}, msg: '' };
const TABS = [
  { id: 'essence', label: 'Суть', has: b => !!b.essence },
  { id: 'economy', label: 'Экономика', has: b => !!b.unit },
  { id: 'game', label: 'Игра', has: b => !!b.game },
  { id: 'traps', label: 'Ловушки', has: b => !!(b.traps && b.traps.length) },
  { id: 'quiz', label: 'Тест', has: b => !!(b.quiz && b.quiz.length) },
  { id: 'gloss', label: 'Словарь и источники', has: b => !!((b.glossary && b.glossary.length) || (b.sources && b.sources.length)) }
];
const M = (v, o) => money(v, (App.biz && App.biz.cur) || '$', o);
function fmtBy(kind, v, cur){
  if(typeof kind === 'function') return kind(v);
  if(kind === 'money') return money(v, cur);
  if(kind === 'pct') return num(v, 1) + '%';
  if(kind === 'pct100') return pct(v, 1);
  return num(v, Math.abs(v) < 10 && v % 1 ? 1 : 0);
}

/* ============================================================
   ИГРОВОЙ ДВИЖОК: чистые функции над объектом состояния S
   ============================================================ */
function gSig(b){ const G = b.game; return [b.id, G.periods.length, G.startCash, G.version || 1].join(':'); }
function gNew(b){
  return { sig: gSig(b), t: 0, cash: b.game.startCash, units: [], nextId: 1, log: [], trades: [], pending: [],
           over: false, bankrupt: false, acc: { op: 0, interest: 0, deposit: 0, oneoff: 0 } };
}
function gP(b, S){ return b.game.periods[S.t]; }
function gLoanType(b, id){ return b.game.loan.types.find(x => x.id === id); }
function gUnitPrice(b, S, u, P){ return Math.max(0, P.price + (b.game.saleAdjust ? b.game.saleAdjust(u, P, S) : 0)); }
function gDebt(S){ return sum(S.units, u => u.loan ? u.loan.bal : 0); }
function gNet(b, S){ const P = gP(b, S); return S.cash + sum(S.units, u => gUnitPrice(b, S, u, P) * (1 - b.game.sellCost) - (u.loan ? u.loan.bal : 0)); }
function gLoanRate(b, L, P){ return L.floating ? gLoanType(b, L.type).rate(P) : L.rate; }

function gQuote(b, S, fin){
  const G = b.game, P = gP(b, S), price = P.price, fee = price * G.buyCost;
  if(fin === 'cash') return { price, fee, loan: 0, need: price + fee };
  const lt = gLoanType(b, fin), loan = price * G.loan.ltv;
  return { price, fee, loan, need: price - loan + fee, rate: lt.rate(P), lt };
}
function gBuy(b, S, fin){
  const G = b.game, P = gP(b, S), q = gQuote(b, S, fin), cur = b.cur || '$';
  if(S.over) return 'Игра уже закончилась.';
  if(S.units.length >= G.maxUnits) return `В игре можно владеть не больше чем ${G.maxUnits} объектами.`;
  if(S.cash + 0.5 < q.need) return `Не хватает денег: нужно ${money(q.need, cur)}, на счёте ${money(S.cash, cur)}. Продайте что-нибудь или возьмите кредит.`;
  S.cash -= q.need;
  const u = { id: S.nextId++, t0: S.t, price: q.price, mode: G.modes ? G.modes[0].id : null, data: {},
              loan: fin === 'cash' ? null : { type: fin, floating: !!q.lt.floating, rate: q.rate, bal: q.loan, left: G.loan.years } };
  if(G.initUnit) G.initUnit(u, P, S);
  S.units.push(u);
  S.trades.push({ kind: 'buy', t: S.t, id: u.id, price: q.price, fin });
  return null;
}
function gSell(b, S, id, forced){
  const G = b.game, P = gP(b, S), u = S.units.find(x => x.id === id); if(!u) return 0;
  const gross = gUnitPrice(b, S, u, P) * (forced ? 1 - G.fireSale : 1);
  const net = gross * (1 - G.sellCost) - (u.loan ? u.loan.bal : 0);
  S.cash += net; S.units = S.units.filter(x => x !== u);
  S.trades.push({ kind: forced ? 'forced' : 'sell', t: S.t, id, price: gross, buyPrice: u.price, buyT: u.t0, net });
  return net;
}
function gSetMode(b, S, id, mode){
  const G = b.game, P = gP(b, S), u = S.units.find(x => x.id === id);
  if(!u || u.mode === mode) return null;
  const lock = G.modeLocked && G.modeLocked(u, S, P); if(lock) return lock;
  const m = G.modes.find(x => x.id === mode), cost = m.switchCost ? m.switchCost(P, u, S) : 0;
  if(cost > S.cash) return `Не хватает денег на переход: нужно ${money(cost, b.cur || '$')}.`;
  if(cost){ S.cash -= cost; S.pending.push([m.switchLabel || ('Переход: ' + m.label), cost]); S.acc.oneoff += cost; }
  const prev = u.mode; u.mode = mode;
  if(G.onModeChange) G.onModeChange(u, prev, mode, P, S);
  return null;
}
function gActions(b, S, u){ return b.game.unitActions ? (b.game.unitActions(u, gP(b, S), S) || []) : []; }
function gAction(b, S, id, idx){
  const P = gP(b, S), u = S.units.find(x => x.id === id), a = u && gActions(b, S, u)[idx];
  if(!a) return null;
  const cost = a.cost || 0;
  if(cost > S.cash) return `Не хватает денег: нужно ${money(cost, b.cur || '$')}.`;
  if(cost){ S.cash -= cost; S.pending.push([a.ledger || a.label, cost]); S.acc.oneoff += cost; }
  a.run(u, P, S);
  return null;
}
function gStep(b, S){
  const G = b.game, P = gP(b, S);
  const row = { t: S.t, label: P.label, rev: 0, costs: 0, interest: 0, principal: 0, deposit: 0, oneoff: 0, costLines: [], notes: [], units: S.units.length };
  row.oneoff = sum(S.pending, x => x[1]); row.oneoffLines = S.pending; S.pending = [];
  row.deposit = S.cash > 0 ? S.cash * (P.deposit || 0) : 0;
  const agg = {};
  for(const u of S.units){
    const r = G.operate(u, P, S) || { revenue: 0, costs: [] };
    row.rev += r.revenue;
    for(const [l, v] of r.costs){ row.costs += v; agg[l] = (agg[l] || 0) + v; }
    if(r.note && !row.notes.includes(r.note)) row.notes.push(r.note);
    if(u.loan){
      const L = u.loan, rate = gLoanRate(b, L, P);
      const i = L.bal * rate, pay = annuity(L.bal, rate, L.left), pr = Math.min(L.bal, Math.max(0, pay - i));
      row.interest += i; row.principal += pr; L.bal -= pr; L.left -= 1;
      if(L.bal < 1 || L.left <= 0){ row.principal += Math.max(0, L.bal); u.loan = null; }
    }
  }
  row.costLines = Object.entries(agg);
  row.op = row.rev - row.costs;
  row.net = row.op - row.interest - row.principal + row.deposit;
  S.cash += row.net;
  S.acc.op += row.op; S.acc.interest += row.interest; S.acc.deposit += row.deposit;
  const last = S.t >= G.periods.length - 1;
  if(!last){ S.t++; if(G.onNewPeriod) G.onNewPeriod(S, gP(b, S)); }
  while(S.cash < 0 && S.units.length){
    const Pn = gP(b, S), eq = u => gUnitPrice(b, S, u, Pn) - (u.loan ? u.loan.bal : 0);
    const u = S.units.slice().sort((a, c) => eq(c) - eq(a))[0];
    gSell(b, S, u.id, true);

/* o: { labels, xs?, series:[{values,label,color}], upto?, fmt, fmtX?, markers?:[{i,kind,text}], zero?, vline?, height?, crossings? } */
function drawLine(host, o){

  if(_ro && !host._obs){ _ro.observe(host); host._obs = true; }
  const W = Math.max(260, host.clientWidth || 600); host._w = W;
  const H = o.height || 170, m = { l: 62, r: 16, t: 14, b: 26 };
  const n = o.labels.length, upto = o.upto == null ? n - 1 : o.upto;
  const xs = o.xs || o.labels.map((_, i) => i), x0 = xs[0], x1 = xs[n - 1];
  const X = v => m.l + (x1 === x0 ? .5 : (v - x0) / (x1 - x0)) * (W - m.l - m.r);
  const vis = [];
  o.series.forEach(sr => sr.values.forEach((v, i) => { if(i <= upto && v != null && isFinite(v)) vis.push(v); }));
  if(o.zero) vis.push(0);

  if(hi - lo < 1e-9){ const p = Math.abs(lo) * .25 || 1; lo -= p; hi += p; }
  const pad = (hi - lo) * .08; if(!o.zero || lo < 0) lo -= pad; hi += pad;
  if(o.floor0 && lo < 0 && Math.min(...vis) >= 0) lo = 0;
  const ticks = niceTicks(lo, hi, 4).filter(t => t >= lo - 1e-9 && t <= hi + 1e-9);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': o.aria || '' });
  for(const t of ticks){
    svg.append(s('line', { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: 'grid' }));
    const tx = s('text', { x: m.l - 8, y: Y(t) + 4, 'text-anchor': 'end' }); tx.textContent = o.fmt(t, true); svg.append(tx);
  }
  if(o.zero && lo < 0 && hi > 0) svg.append(s('line', { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), class: 'zero' }));
  // подписи оси X
  if(o.xs){
    for(const t of niceTicks(x0, x1, 5).filter(t => t >= x0 && t <= x1)){
      const tx = s('text', { x: X(t), y: H - 6, 'text-anchor': 'middle' }); tx.textContent = (o.fmtX || String)(t); svg.append(tx);
    }
  } else {
    const every = Math.ceil(n / Math.max(3, Math.floor((W - m.l) / 52)));
    o.labels.forEach((l, i) => { if(i % every && i !== n - 1) return;
      const tx = s('text', { x: X(i), y: H - 6, 'text-anchor': 'middle', class: i > upto ? 'tick-future' : '' }); tx.textContent = l; svg.append(tx); });
  }
  // линии
  o.series.forEach((sr, si) => {
    const pts = []; sr.values.forEach((v, i) => { if(i <= upto && v != null && isFinite(v)) pts.push([X(xs[i]), Y(v), i, v]); });
    if(!pts.length) return;
    const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if(o.series.length === 1 && pts.length > 1){
      const base = Y(Math.max(lo, Math.min(hi, o.zero ? 0 : lo)));
      svg.append(s('path', { d: d + ` L${pts[pts.length - 1][0].toFixed(1)} ${base} L${pts[0][0].toFixed(1)} ${base} Z`, fill: sr.color, 'fill-opacity': .1, stroke: 'none' }));
    }
    svg.append(s('path', { d, fill: 'none', stroke: sr.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    if(!o.xs){
      const lp = pts[pts.length - 1];
      svg.append(s('circle', { cx: lp[0], cy: lp[1], r: 4.5, fill: sr.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
      if(o.series.length === 1){
        const tx = s('text', { x: Math.min(lp[0] + 8, W - m.r), y: lp[1] - 9, 'text-anchor': lp[0] > W - 90 ? 'end' : 'start', class: 'endlabel' });
        tx.textContent = o.fmt(lp[3]); svg.append(tx);
      }
    }
  });
  // точки пересечения нуля (для калькулятора)
  if(o.crossings){
    const v = o.series[0].values;
    for(let i = 1; i < v.length; i++){
      if((v[i - 1] < 0) !== (v[i] < 0)){
        const k = v[i - 1] / (v[i - 1] - v[i]), xv = xs[i - 1] + k * (xs[i] - xs[i - 1]);
        svg.append(s('circle', { cx: X(xv), cy: Y(0), r: 5, fill: 'var(--surface)', stroke: 'var(--ink)', 'stroke-width': 2 }));
        const right = X(xv) < W - 150, tx = s('text', { x: X(xv) + (right ? 9 : -9), y: Y(0) + 18, 'text-anchor': right ? 'start' : 'end', class: 'endlabel' });
        tx.textContent = 'ноль при ' + (o.fmtX || String)(xv); svg.append(tx);
      }
    }
  }
  if(o.vline != null){
    const xv = X(o.vline.x);
    svg.append(s('line', { x1: xv, x2: xv, y1: m.t, y2: H - m.b, stroke: 'var(--accent)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }));
    const tx = s('text', { x: xv + (xv > W - 110 ? -6 : 6), y: m.t + 10, 'text-anchor': xv > W - 110 ? 'end' : 'start', class: 'endlabel' });
    tx.textContent = o.vline.label; svg.append(tx);
  }
  // сделки
  for(const mk of o.markers || []){
    const v = o.series[0].values[mk.i]; if(v == null) continue;

  }

  const hit = s('rect', { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: 'transparent' });
  svg.append(xh, hit);
  const tip = h('div', { class: 'tip', role: 'status' });
  host.append(svg, tip);
  const nearest = px => { let best = 0, bd = 1e9; for(let i = 0; i <= Math.min(upto, n - 1); i++){ const d = Math.abs(X(xs[i]) - px); if(d < bd){ bd = d; best = i; } } return best; };

    tip.textContent = '';

    for(const sr of o.series){ const v = sr.values[i]; if(v == null) continue;
      tip.append(h('div', { class: 't-row' }, h('i', { style: `background:${sr.color}` }), h('b', null, o.fmt(v)), sr.label ? h('span', null, sr.label) : null)); }

    tip.style.display = 'block';
    const tw = tip.offsetWidth; tip.style.left = clamp(cx + 12 + tw > W ? cx - tw - 12 : cx + 12, 0, Math.max(0, W - tw)) + 'px'; tip.style.top = '6px';
  };

  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); show(nearest((e.clientX - r.left) * W / r.width)); });
  hit.addEventListener('pointerleave', hide);

  host.onfocus = () => { host._ki = Math.min(upto, n - 1); show(host._ki); };
  host.onblur = hide;
  host.onkeydown = e => { if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); host._ki = clamp((host._ki || 0) + (e.key === 'ArrowRight' ? 1 : -1), 0, Math.min(upto, n - 1)); show(host._ki); } };
}
function drawWaterfall(host, lines, cur){
  host.textContent = ''; let run = 0;

    if(l.kind === 'total'){ a = 0; c = l.v != null ? l.v : run; run = c; }
    else if(l.kind === 'in'){ a = run; c = run + l.v; run = c; }
    else { a = run; c = run - l.v; run = c; }
    return Object.assign({}, l, { a, c }); });

      if(chart.isConnected) drawLine(chart, o); else afterMount.push(() => drawLine(chart, o));
    }
  }
  update();
}

/* ---------- 3. Игра ---------- */
function renderGame(b, root){
  const G = b.game, S = getGame(b), P = gP(b, S), cur = b.cur || '$';

  const fleet = h('section', { class: 'panel' }, h('h2', { class: 'panel-title' }, h('span', null, G.unit.plural), h('span', null, String(S.units.length))));

  for(const u of S.units){

  let buy = null;

        `Банк даёт ${pct(G.loan.ltv, 0)} цены на ${G.loan.years} лет, ставка сейчас ${pct(qq.rate)}${qq.lt.floating ? ' и будет меняться вместе с рынком' : ' и зафиксирована на весь срок'}. Своих нужно ${M(qq.need)}.`;
      fin.append(h('label', null, h('input', { type: 'radio', name: 'fin-' + b.id, checked: f.id === sel, onchange: () => { App.buyFin[b.id] = f.id; const y = window.scrollY; render(); window.scrollTo({ top: y }); } }),
        h('b', null, f.label), h('small', null, desc)));

      h('h2', { class: 'panel-title' }, h('span', null, `Купить ${G.unit.acc}`), h('span', { class: 'num' }, M(P.price))),
      G.buyNote ? h('p', { class: 'note', html: typeof G.buyNote === 'function' ? G.buyNote(P, S) : G.buyNote }) : null,
      fin,
      h('div', { class: 'row' }, h('button', { class: 'btn', disabled: full || S.cash + 0.5 < q.need, onclick: () => act(() => gBuy(b, S, sel)) },
        full ? `Лимит: ${G.maxUnits}` : `Купить за ${M(P.price)}`)));
  }

  const msg = h('div', { class: 'msg', role: 'alert' }, App.msg || '');
  let confirmReset = false;
  const resetBtn = h('button', { class: 'btn danger small', onclick: e => {
    if(!confirmReset){ confirmReset = true; e.currentTarget.textContent = 'Точно начать заново? Нажмите ещё раз'; return; }
    App.games[b.id] = gNew(b); saveGame(b); render(); } }, 'Начать заново');
  const isLast = S.t >= G.periods.length - 1;
  const next = h('div', { class: 'next' + (S.over ? ' done' : '') },
    S.over ? h('button', { class: 'btn primary', onclick: () => { App.games[b.id] = gNew(b); saveGame(b); render(); window.scrollTo({ top: 0 }); } }, 'Сыграть ещё раз')
      : h('button', { class: 'btn primary', onclick: () => { gStep(b, S); App.msg = ''; saveGame(b); render(); if(S.over) window.scrollTo({ top: 0, behavior: 'smooth' }); } },
          isLast ? `Прожить ${P.label}${G.periodWord || ''} и подвести итог` : `Прожить ${P.label}${G.periodWord || ''} →`),
    S.over ? null : resetBtn);

  // графики
  const charts = h('section', { class: 'panel' }, h('h2', { class: 'panel-title' }, h('span', null, 'Рынок'), h('span', { class: 'muted', style: 'text-transform:none;letter-spacing:0' }, S.over ? 'вся история' : 'будущее скрыто')));
  const labels = G.periods.map(p => p.tick || p.label);
  const markers = S.trades.map(tr => ({ i: tr.t, kind: tr.kind,
    text: tr.kind === 'buy' ? `▲ покупка №${tr.id}` : tr.kind === 'forced' ? `▼ вынужденная продажа №${tr.id}` : `▼ продажа №${tr.id}` }));
  (G.charts || [{ title: 'Цена', series: [{ key: 'price', label: 'Цена' }], fmt: 'money' }]).forEach((c, ci) => {

    const f = c.fmt === 'money' ? (v, tick) => money(v, cur) : c.fmt === 'pct' ? v => pct(v, 1) : (c.fmt || (v => num(v)));

  // журнал

      h('p', { class: 'note' }, '«Расходы» включают разовые траты (ремонт, переоборудование). «Банку» — проценты и погашение долга. Покупки и продажи активов в журнал не входят: они видны на графике цены.'));
  }

  root.append(h('div', { class: 'game-grid' },
    h('div', { class: 'col' }, status, recap, news, fleet, buy, msg, next),

function renderResults(b, S){
  const G = b.game, nw = gNet(b, S), start = G.startCash, profit = nw - start, cur = b.cur || '$';
  const bench = gBenchmarks(b), bestB = Math.max(...bench.map(x => x.value)), dep = bench[0].value;
  let title, text;
  if(S.bankrupt){ title = 'Банкротство'; text = 'Долг оказался больше, чем стоили активы. Так заканчивается рычаг, купленный не в той фазе цикла.'; }
  else if(nw >= bestB){ title = 'Вы обыграли все ориентиры'; text = 'Вы заработали больше, чем пассивные стратегии. Посмотрите ниже, откуда пришли деньги: из потока или из сделок.'; }
  else if(nw > dep){ title = 'Лучше депозита, но не лучше всех'; text = 'Результат выше безрискового, но какая-то простая стратегия дала больше. Сравните цифры ниже.'; }
  else { title = 'Депозит оказался лучше'; text = 'Деньги, просто лежавшие под процент, принесли больше. Это частый итог в капиталоёмком бизнесе, если купить не вовремя.'; }
  const all = [{ label: 'Ваш результат', value: nw, you: true }].concat(bench);
  const mx = Math.max(...all.map(x => x.value), 1);
  const bars = h('div', { class: 'bars' }, all.map(x => h('div', { class: 'bar-row' + (x.you ? ' you' : '') },
    h('div', { class: 'lab' }, x.label), h('div', { class: 'track' }, h('div', { class: 'fill', style: `width:${clamp(x.value / mx * 100, 0, 100)}%` })),
    h('div', { class: 'val' }, `${money(x.value, cur)} · ×${num(x.value / start, 2)}`))));
  const a = S.acc, capital = profit - (a.op - a.interest + a.deposit - a.oneoff);
  const line = (l, v, cls) => h('div', { class: cls || '' }, h('span', null, l), h('b', { class: v < 0 ? 'neg' : 'pos' }, money(v, cur, { sign: true })));
  const decomp = h('div', { class: 'decomp' },
    line(G.opLabel || 'Операционный поток (доход минус расходы)', a.op), line('Проценты банку', -a.interest), line('Проценты по депозиту', a.deposit),
    line('Разовые траты (ремонт, переоборудование)', -a.oneoff), line('Сделки и переоценка активов (купил → продал / стоит сейчас)', capital),
    line('Итого прибыль за игру', profit, 'sum'));
  const prices = G.periods.map(p => p.price), iMin = prices.indexOf(Math.min(...prices)), iMax = prices.indexOf(Math.max(...prices));
  const trades = [];
  for(const tr of S.trades) if(tr.kind !== 'buy') trades.push(`№${tr.id}: куплено в ${G.periods[tr.buyT].label} за ${money(tr.buyPrice, cur)}, ${tr.kind === 'forced' ? 'принудительно продано' : 'продано'} в ${G.periods[tr.t].label} за ${money(tr.price, cur)} (×${num(tr.price / tr.buyPrice, 2)}).`);
  const P = gP(b, S);
  for(const u of S.units) trades.push(`№${u.id}: куплено в ${G.periods[u.t0].label} за ${money(u.price, cur)}, к концу игры стоит ${money(gUnitPrice(b, S, u, P), cur)}.`);
  const lessons = [];
  if(!S.trades.length) lessons.push('Вы так ничего и не купили. Это тоже решение: вы отказались и от риска, и от шанса на цикле.');
  if(S.trades.some(t => t.kind === 'forced')) lessons.push('Была вынужденная продажа. Рычаг сам по себе не убивает; убивает нехватка денег в момент, когда рынок на дне и покупателей мало.');
  if(a.op > 0 && capital > a.op) lessons.push('Сделки принесли больше, чем операционный поток. В циклических капиталоёмких бизнесах так бывает часто: важнее, почём купить и продать.');
  if(a.op > capital && a.op > 0) lessons.push('Основной вклад дал операционный поток, а не сделки. Посмотрите в журнале, в какие годы он пришёл: обычно это несколько лучших лет цикла.');
  return h('section', { class: 'panel results' },
    h('span', { class: 'eyebrow' }, 'Итог игры'),
    h('h2', null, title), h('p', { class: 'prose' }, text),
    h('div', { class: 'grid-2' },
      h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'С чем сравнить'), bars,
        h('p', { class: 'note' }, `Старт: ${money(start, cur)}. Лучшая цена для покупки в этой истории была в ${G.periods[iMin].label} (${money(prices[iMin], cur)}), для продажи — в ${G.periods[iMax].label} (${money(prices[iMax], cur)}).`)),
      h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'Откуда взялся результат'), decomp)),
    trades.length ? h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'Ваши сделки'), h('ul', { class: 'lessons' }, trades.map(t => h('li', null, t)))) : null,
    h('div', { class: 'col' }, h('h3', { class: 'panel-title' }, 'Выводы'), h('ul', { class: 'lessons' }, lessons.concat(G.lessons || []).map(t => h('li', { html: t })))));
}

function renderQuiz(b, root){
  const st = App.quiz[b.id] || (App.quiz[b.id] = {});
  const done = Object.keys(st).length, right = b.quiz.filter((q, i) => st[i] === q.correct).length;
  root.append(h('div', { class: 'score' }, h('span', { class: 'pill' + (done === b.quiz.length ? (right === done ? ' pos' : ' warn') : '') }, `Верно ${right} из ${b.quiz.length}`),
    done ? h('button', { class: 'btn small', onclick: () => { App.quiz[b.id] = {}; render(); } }, 'Пройти заново') : null));
  b.quiz.forEach((q, i) => {
    const ans = st[i];
    const opts = h('div', { class: 'opts' }, q.options.map((o, k) => h('button', {
      class: 'opt' + (ans != null ? (k === q.correct ? ' right' : k === ans ? ' wrong' : '') : ''), disabled: ans != null,
      onclick: () => { st[i] = k; const y = window.scrollY; render(); window.scrollTo({ top: y }); } }, h('span', { html: o }))));
    root.append(h('article', { class: 'q' }, h('h3', null, h('span', null, `Вопрос ${i + 1}`), h('span', { html: q.q, style: 'font:inherit;color:inherit;margin:0' })), opts,
      ans != null ? h('p', { class: 'explain', html: (ans === q.correct ? '<b class="pos">Верно.</b> ' : '<b class="neg">Не совсем.</b> ') + q.explain }) : null));

}

/* ---------- Сравнение ---------- */
const PROFILE_AXES = [
  { id: 'capital', label: 'Капиталоёмкость', hint: '1 — хватит сбережений, 5 — нужны миллионы и банк' },
  { id: 'cycle', label: 'Скорость цикла', hint: '1 — волна идёт десятилетиями, 5 — за 2–3 года' },
  { id: 'volatility', label: 'Разброс дохода по годам', hint: '1 — почти стабилен, 5 — от убытка до сверхприбыли' },
  { id: 'liquidity', label: 'Ликвидность актива', hint: '1 — продать быстро можно только с большой скидкой' },

  const FLOAT = 0.015;                 // плавающая ипотека = ключевая + 1,5%
  const RENO = 15000;

  registerBusiness({
    id: 'rent',
    name: 'Аренда квартиры',
    badge: 'м²',
    accent: { light: '#1d6a5a', dark: '#4cc3a8' },
    cur: '$',
    tagline: 'Кажется пассивным доходом, а по сути это маломаржинальный операционный бизнес, привязанный к циклу процентных ставок.',

    essence: {
      thesis: 'Собственник покупает квартиру и сдаёт её. Доход — аренда минус простой, налоги, ремонты и обновление обстановки. Как и с судами, итог складывается из денежного потока и изменения цены квартиры. Только волна здесь идёт годами, а решает всё ставка: по ипотеке и по депозиту.',
      facts: [
        { v: '7% → 4,5%', l: 'грязная и чистая доходность в примере: $12 000 аренды в год на $170 000 вложений' },
        { v: '≈ 5,5%', l: 'валовая арендная доходность в Москве, январь 2026 (ЦИАН). Чистая ещё ниже' },
        { v: '21% → 16%', l: 'ключевая ставка Банка России за 2025 год. Вклады платили больше, чем аренда' },
        { v: '−27%', l: 'падение цен на жильё в США с июля 2006 по февраль 2012 (индекс Case-Shiller)' }
      ],
      flow: {
        nodes: [
          { name: 'Арендатор', sub: 'платит за право жить в квартире' },
          { name: 'Собственник', sub: 'покупает, ремонтирует, ищет жильцов, решает проблемы', you: true },
          { name: 'Государство, банк, мастера, агент', sub: 'получают свою долю раньше вас' }
        ],
        links: [ 'аренда раз в месяц', 'налоги, ипотека, ремонт, комиссии' ]
      },
      flowNote: 'В посуточной аренде между вами и гостем встают ещё площадка (базовая комиссия Яндекс Путешествий — 17%, Airbnb в модели «платит хозяин» — около 15%) и управляющая компания (обычно 20–30% выручки).',
      blocks: [
        { title: 'Грязная и чистая доходность', text: 'Квартира за $150 000 плюс $20 000 на ремонт, мебель и сделку. Аренда $1 000 в месяц — это $12 000 в год, или 7% на вложенное. Минус 3–4 недели простоя, налог и страховка, мелкий ремонт и резерв на обновление раз в 7 лет — остаётся около $7 900, то есть 4,6%.' },
        { title: 'Долгосрочная и посуточная — разные бизнесы', text: 'Долгосрочная аренда похожа на облигацию: низкая доходность, мало хлопот. Посуточная — это мини-гостиница. Выручка выше, но её съедают комиссии площадок, управляющая компания, уборки, коммуналка и износ. Упал рейтинг — упала загрузка.' },
        { title: 'Кредит работает только под горку', text: 'Ипотека повышает доходность на свои деньги, только если ставка ниже чистой доходности квартиры. При 4,5% чистыми и ипотеке 10% каждый заёмный доллар работает в минус. Разницу вы доплачиваете из кармана и надеетесь на рост цены.' },
        { title: 'Фиксированная или плавающая ставка', text: 'Когда центробанк поднимает ставку, платёж по фиксированной ипотеке не меняется. Страдают заёмщики с плавающей ставкой и те, кто покупает сейчас. Но и владельцы с фиксированной ставкой теряют: депозит начинает платить больше аренды, покупатели исчезают, цены замирают.' }
      ]
    },

    unit: {
      title: 'Одна квартира за год',
      intro: 'Начните с долгосрочной аренды, потом переключитесь на посуточную и сравните. Отдельно посмотрите на строку «Максимальная ставка ипотеки»: включите ипотеку и двигайте ставку.',
      inputs: [
        { id: 'mode', label: 'Формат', value: 'ltr', options: [ { id: 'ltr', label: 'Долгосрочная' }, { id: 'str', label: 'Посуточная через УК' } ] },
        { id: 'price', label: 'Цена квартиры', min: 50000, max: 500000, step: 5000, value: 150000, fmt: 'money' },
        { id: 'setup', label: 'Ремонт, мебель, сделка', min: 0, max: 80000, step: 1000, value: 20000, fmt: 'money' },
        { id: 'rent', label: 'Аренда в месяц', min: 300, max: 4000, step: 50, value: 1000, fmt: 'money', showIf: v => v.mode === 'ltr',
          hint: 'Для ориентира: валовая доходность в Москве ≈5,5% в год (ЦИАН, январь 2026), в Лондоне ≈5–5,5%, в Париже ≈4,8% (Global Property Guide).' },
        { id: 'vac', label: 'Простой между жильцами, недель в год', min: 0, max: 12, step: 0.5, value: 3.5, showIf: v => v.mode === 'ltr' },
        { id: 'adr', label: 'Цена за ночь', min: 20, max: 300, step: 5, value: 70, fmt: 'money', showIf: v => v.mode === 'str' },
        { id: 'occ', label: 'Загрузка, % ночей', min: 20, max: 95, step: 1, value: 65, fmt: 'pct', showIf: v => v.mode === 'str',
          hint: 'У хорошо управляемых квартир в Москве — 65–75% (оценка отраслевого блога). Средняя по рынку ниже.' },
        { id: 'plat', label: 'Комиссия площадки, %', min: 0, max: 25, step: 1, value: 17, fmt: 'pct', showIf: v => v.mode === 'str',
          hint: 'Яндекс Путешествия: 17% базовая. Airbnb: около 15% в модели «платит хозяин».' },
        { id: 'mgmt', label: 'Управляющая компания, % выручки', min: 0, max: 35, step: 1, value: 25, fmt: 'pct', showIf: v => v.mode === 'str',
          hint: 'Обычно 20–30%. Ноль — если управляете сами, но тогда это ваша работа.' },
        { id: 'clean', label: 'Уборка и стирка за заезд', min: 0, max: 80, step: 1, value: 25, fmt: 'money', showIf: v => v.mode === 'str' },
        { id: 'stay', label: 'Средняя длительность проживания, ночей', min: 1, max: 10, step: 0.5, value: 3, showIf: v => v.mode === 'str' },
        { id: 'util', label: 'Коммуналка, интернет, расходники в год', min: 0, max: 5000, step: 100, value: 1600, fmt: 'money', showIf: v => v.mode === 'str' },
        { id: 'ptax', label: 'Налог на имущество в год', min: 0, max: 3000, step: 50, value: 150, fmt: 'money', hint: 'РФ: базовая ставка 0,1% кадастровой стоимости.' },
        { id: 'maint', label: 'Страховка и мелкий ремонт в год', min: 0, max: 5000, step: 100, value: 1000, fmt: 'money' },
        { id: 'reno', label: 'Обновление ремонта', min: 0, max: 60000, step: 1000, value: 15000, fmt: 'money' },
        { id: 'renoY', label: 'Раз в сколько лет', min: 3, max: 15, step: 1, value: 7, hint: 'В посуточной ремонт изнашивается быстрее, обычно за 4–5 лет.' },
        { id: 'tax', label: 'Налог с дохода, %', min: 0, max: 25, step: 1, value: 4, fmt: 'pct',
          hint: 'РФ: самозанятый — 4% при сдаче физлицам (6% — компаниям), НДФЛ — 13%. Считаем с выручки.' },
        { id: 'ltv', label: 'Ипотека, % цены', min: 0, max: 90, step: 5, value: 0, fmt: 'pct' },
        { id: 'mr', label: 'Ставка ипотеки, % годовых', min: 1, max: 25, step: 0.25, value: 10, fmt: 'pct', showIf: v => v.ltv > 0 },
        { id: 'yrs', label: 'Срок ипотеки, лет', min: 5, max: 30, step: 1, value: 20, showIf: v => v.ltv > 0 },
        { id: 'alt', label: 'Альтернатива: депозит, % годовых', min: 0, max: 25, step: 0.25, value: 5, fmt: 'pct',
          hint: 'В 2025 году вклады в России платили заметно больше, чем приносила аренда.' }
      ],
      compute(v){
        const invested = v.price + v.setup, loan = v.price * v.ltv / 100, equity = invested - loan, lines = [];
        let gross, taxBase;
        if(v.mode === 'ltr'){
          const pot = v.rent * 12, vac = pot * v.vac / 52; gross = pot; taxBase = pot - vac;
          lines.push({ label: 'Аренда за 12 месяцев', v: pot, kind: 'in' }, { label: `Простой: ${num(v.vac, 1)} нед.`, v: vac, kind: 'out' });
        } else {
          const nights = 365 * v.occ / 100; gross = nights * v.adr;
          const plat = gross * v.plat / 100, mg = (gross - plat) * v.mgmt / 100, cl = nights / v.stay * v.clean; taxBase = gross - plat;
          lines.push({ label: `Проживание: ${num(nights)} ночей × ${money(v.adr)}`, v: gross, kind: 'in' },
            { label: 'Комиссия площадки', v: plat, kind: 'out' }, { label: 'Управляющая компания', v: mg, kind: 'out' },
            { label: 'Уборки и стирка', v: cl, kind: 'out' }, { label: 'Коммуналка и расходники', v: v.util, kind: 'out' });
        }
        lines.push({ label: 'Налог на имущество', v: v.ptax, kind: 'out' }, { label: 'Страховка и мелкий ремонт', v: v.maint, kind: 'out' },
          { label: 'Резерв на обновление ремонта', v: v.reno / v.renoY, kind: 'out' });
        let noi = 0; for(const l of lines) noi += l.kind === 'in' ? l.v : -l.v;
        const tax = taxBase * v.tax / 100, afterTax = noi - tax;
        lines.push({ label: 'Чистый операционный доход (NOI)', kind: 'total' }, { label: 'Налог с дохода', v: tax, kind: 'out' });
        const r = v.mr / 100, pay = loan ? annuity(loan, r, v.yrs) : 0, interest = loan * r;
        if(loan) lines.push({ label: 'Ипотека: проценты', v: interest, kind: 'out' }, { label: 'Ипотека: погашение долга', v: pay - interest, kind: 'out' });
        lines.push({ label: 'Остаётся владельцу', kind: 'total' });
        const result = afterTax - pay, net = afterTax / invested, coc = result / equity;
        let maxRate = '—', maxHint = 'Включите ипотеку, чтобы узнать.';
        if(loan){
          if(annuity(loan, 0, v.yrs) > afterTax){ maxRate = 'нет'; maxHint = 'Даже под 0% погашение долга больше дохода: без доплат не обойтись.'; }
          else { let lo = 0, hi = 1; for(let i = 0; i < 50; i++){ const m = (lo + hi) / 2; if(annuity(loan, m, v.yrs) > afterTax) hi = m; else lo = m; }
            maxRate = pct(lo); maxHint = 'Выше этой ставки платёж банку больше дохода от квартиры.'; }
        }
        return {
          lines, result, resultLabel: 'Денежный поток владельцу за год',
          kpis: [
            { label: 'Грязная доходность', value: pct(gross / invested), hint: 'Выручка / все вложения. Эту цифру обычно называют продавцы.' },
            { label: 'Чистая доходность', value: pct(net), tone: net >= v.alt / 100 ? 'pos' : 'neg', hint: `NOI после налога / вложения. Депозит: ${num(v.alt, 2)}%.` },
            { label: 'Доходность на свои деньги', value: pct(coc), tone: coc >= v.alt / 100 ? 'pos' : 'neg', hint: `Поток после ипотеки / собственные ${money(equity)}.` },
            { label: 'Максимальная ставка ипотеки', value: maxRate, hint: maxHint },
            { label: 'Окупаемость вложений', value: afterTax > 0 ? num(invested / afterTax, 1) + ' ' + plural(Math.round(invested / afterTax), 'год', 'года', 'лет') : 'не окупается', hint: 'Без учёта роста цены и аренды.' }
          ],
          note: 'Погашение тела ипотеки — не расход, а накопление: растёт ваша доля в квартире. Но наличными его платить всё равно нужно каждый месяц.'
        };
      },
      sweep: v => v.mode === 'str'
        ? { key: 'occ', from: 20, to: 95, label: 'Загрузка, %', fmt: 'pct' }
        : { key: 'rent', from: 300, to: 3000, label: 'Аренда в месяц', fmt: 'money' }
    },

    game: {
      version: 1,
      intro: 'У вас <b>$200 000</b> и 12 лет. Сценарий условный, но собран из типичных фаз: дешёвые деньги, бум, шок ставок, застой, восстановление. Покупайте квартиры за свои или в ипотеку, выбирайте формат сдачи, обновляйте ремонт, рефинансируйтесь и продавайте.',
      startCash: 200000, maxUnits: 5,
      unit: { one: 'квартира', One: 'Квартира', acc: 'квартиру', plural: 'Ваши квартиры', countLabel: 'кв.', empty: 'Квартир пока нет. Деньги лежат на депозите под ставку года.' },
      buyCost: 0.03, sellCost: 0.04, fireSale: 0.15,
      loan: { ltv: 0.7, years: 20, types: [
        { id: 'fixed', label: 'Ипотека 70%, фиксированная ставка', floating: false, rate: p => p.mort },
        { id: 'float', label: 'Ипотека 70%, плавающая ставка', floating: true, rate: p => p.base + FLOAT }
      ] },
      depositLabel: 'Все деньги на депозите',
      holdLabel: 'Купить квартиру за свои в 1-й год, сдавать и держать',
      holdStrategy(S, A){
        if(S.t === 0) A.buy('cash');
        for(const u of S.units) if(S.t - u.data.reno >= 7) A.actionById(u, 'reno');
      },
      buyNote: 'Все квартиры одинаковые, с ремонтом; цена и аренда — средние по рынку года.',
      modes: [
        { id: 'ltr', label: 'Долгосрочно', short: 'долгосрочная аренда', desc: 'Жилец на год и дольше. Простой — несколько недель между жильцами.' },
        { id: 'str', label: 'Посуточно (УК)', short: 'посуточная через управляющую компанию', desc: 'Выручка выше, но комиссии, уборки и износ. Загрузка скачет вместе с туризмом.',
          switchCost: p => 3000 * K(p), switchLabel: 'Подготовка к посуточной: мебель, замок, фото' }
      ],
      initUnit(u, p, S){ u.data.reno = S.t; },
      operate(u, p, S){
        const k = K(p), age = S.t - u.data.reno;
        if(u.mode === 'ltr'){
          const rent = p.rent * (age >= 7 ? 0.85 : 1), revenue = rent * 12 * (1 - p.vac / 52);
          return { revenue, costs: [ [ 'Налог на имущество и страховка', 450 * k ], [ 'Мелкий ремонт, техника, коммуналка в простой', 1000 * k ],
            [ 'Комиссия агенту при смене жильца', rent * 0.35 ], [ 'Налог с дохода 4%', revenue * 0.04 ] ] };
        }
        const sh = p.strShock, occ = p.occ * (age >= 5 ? 0.8 : 1) * (sh ? sh.occ : 1), adr = p.rent / 30 * 2.1 * (p.adrK || 1);
        const nights = 365 * occ, gross = nights * adr, plat = gross * 0.17, mg = (gross - plat) * 0.25;
        const costs = [ [ 'Комиссия площадки 17%', plat ], [ 'Управляющая компания 25%', mg ], [ 'Уборки и стирка', nights / 3 * 25 * k ],
          [ 'Коммуналка и расходники', 1600 * k ], [ 'Налог на имущество и страховка', 450 * k ], [ 'Износ и мелкий ремонт', 1500 * k ], [ 'Налог с дохода 4%', (gross - plat) * 0.04 ] ];
        if(sh) costs.push([ 'Регистрация и штрафы', sh.cost * k ]);
        return { revenue: gross, costs };
      },
      unitActions(u, p, S){
        const k = K(p), out = [];
        if(S.t - u.data.reno >= 5) out.push({ id: 'reno', label: `Обновить ремонт: ${money(RENO * k)}`, cost: RENO * k, ledger: 'Обновление ремонта', run: x => { x.data.reno = S.t; } });
        if(u.loan && (u.loan.floating || p.mort < u.loan.rate - 0.01))
          out.push({ id: 'refi', label: `Рефинансировать: фикс ${pct(p.mort)}`, cost: u.loan.bal * 0.01, ledger: 'Комиссия за рефинансирование',
            hint: 'Новый кредит с фиксированной ставкой на остаток срока, комиссия 1% долга.', run: x => { x.loan.floating = false; x.loan.type = 'fixed'; x.loan.rate = p.mort; } });
        return out;
      },
      unitInfo(u, p, S){
        const out = [], age = S.t - u.data.reno, lim = u.mode === 'str' ? 5 : 7;
        out.push(age >= lim
          ? { warn: true, text: `Ремонту ${age} ${plural(age, 'год', 'года', 'лет')}: ${u.mode === 'str' ? 'загрузка на 20% ниже' : 'аренда на 15% ниже рынка'}. Пора обновить.` }
          : `Ремонту ${age} ${plural(age, 'год', 'года', 'лет')}${age ? '' : ' (свежий)'}. В этом формате он устареет через ${lim - age} ${plural(lim - age, 'год', 'года', 'лет')}.`);
        if(u.loan){
          const r = u.loan.floating ? p.base + FLOAT : u.loan.rate, pay = annuity(u.loan.bal, r, u.loan.left), rentY = p.rent * 12;
          out.push({ warn: pay > rentY * 0.75, text: `Платёж банку в этом году ≈ ${money(pay)} при аренде ${money(rentY)} в год.` });
        }
        if(p.strShock && u.mode === 'str') out.push({ warn: true, text: 'Новые правила: загрузка посуточной −30%, регистрация и штрафы.' });
        return out;
      },
      metrics: [
        { label: 'Цена квартиры', get: p => money(p.price) },
        { label: 'Аренда', get: p => money(p.rent) + '/мес' },
        { label: 'Грязная доходность', get: p => pct(p.rent * 12 / p.price) },
        { label: 'Ипотека: фикс / плав.', get: p => pct(p.mort) + ' / ' + pct(p.base + FLOAT) },
        { label: 'Депозит', get: p => pct(p.deposit) },
        { label: 'Загрузка посуточной', get: p => pct(p.occ * (p.strShock ? p.strShock.occ : 1), 0) }
      ],
      charts: [
        { title: 'Цена типовой квартиры', series: [ { key: 'price', label: 'Цена' } ], fmt: 'money' },
        { title: 'Что выгоднее: аренда или депозит', series: [ { get: p => p.rent * 12 / p.price, label: 'Грязная доходность аренды' }, { key: 'deposit', label: 'Депозит' }, { key: 'mort', label: 'Ипотека, фикс.' } ], fmt: 'pct', height: 170 }
      ],
      chartNote: 'Когда линия депозита выше линии доходности аренды, деньги выгоднее держать на вкладе. ▲ — покупка, ▼ — продажа.',
      periods: [
        { label: '1-й год', tick: '1', title: 'Тихая гавань', tag: 'Норма', mood: 0,
          text: 'Спокойный рынок. Квартира стоит $150 000 и сдаётся за $1 000 в месяц: 8% грязными от цены. Ипотека — 8%, вклад — 5,5%. Заёмные деньги стоят дороже, чем приносит квартира.',
          price: 150000, rent: 1000, base: 0.06, mort: 0.08, deposit: 0.055, vac: 3.5, occ: 0.62 },
        { label: '2-й год', tick: '2', title: 'Ставки пошли вниз', tag: 'Смягчение', mood: 0,
          text: 'Инфляция замедлилась, центробанк снижает ставку. Вклады приносят меньше, ипотека дешевеет, покупателей становится больше.',
          price: 156000, rent: 1010, base: 0.045, mort: 0.065, deposit: 0.04, vac: 3, occ: 0.64 },
        { label: '3-й год', tick: '3', title: 'Дешёвые деньги', tag: 'Ипотека дешевеет', mood: 1,
          text: 'Ипотека по 5%, вклад — 2,5%. Банки активно кредитуют, в офисах продаж очереди. Цены за год +8%, аренда почти стоит на месте.',
          price: 168000, rent: 1030, base: 0.03, mort: 0.05, deposit: 0.025, vac: 3, occ: 0.68, adrK: 1.05 },
        { label: '4-й год', tick: '4', title: 'Ипотечный бум', tag: 'Бум', mood: 2,
          text: 'Цены +12% за год. Все вокруг говорят, что «недвижимость никогда не дешевеет» и что надо успеть. Грязная доходность новой покупки упала до 6,7%.',
          price: 188000, rent: 1050, base: 0.025, mort: 0.045, deposit: 0.02, vac: 2.5, occ: 0.72, adrK: 1.1 },
        { label: '5-й год', tick: '5', title: 'Пик эйфории', tag: 'Пик', mood: 2,
